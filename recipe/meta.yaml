{% set name = "dvc-azure" %}
{% set version = "3.1.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace('-', '_') }}-{{ version }}.tar.gz
  sha256: db2f9b069e68d1bbae67f953a373ebde42d404d6c7e894d95d597c8ad753a660

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools_scm >=6.3.1
  run:
    - python >={{ python_min }}
    - dvc
    - adlfs >=2023.12.0
    - azure-identity >=1.4.0
    - knack

test:
  imports:
    - dvc_azure
  requires:
    - git
    - pip
    - portalocker >=1.6,<2.0 # Temporary; see discussion around <https://github.com/conda-forge/dvc-feedstock/pull/234#issuecomment-907311619>
    - python {{ python_min }}
  commands:
    - pip check
    - dvc version
    - dvc version | grep azure

about:
  home: https://github.com/iterative/dvc-azure
  summary: Azure plugin for DVC
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - efiop
    - shcheklein
    - skshetry
